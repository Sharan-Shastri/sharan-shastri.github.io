  summary: >
    Electric Machines/Electromechanical Engineer with 7+ years of academic and industrial experience in electric-machine design, motor-drive systems, electromagnetic modelling, controls, system validation, and engineering automation. Experienced in hardware–software integration, MATLAB/Simulink/Python-based modelling and automation, CAE-to-test correlation, root-cause investigation, prototype testing, and cross-functional product development across automotive and consumer applications.

  social_networks:
