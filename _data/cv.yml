  sections:
    Experience:
      - company: Jaguar Land Rover
        position: e-Machines Systems Engineer
        location: Bangalore, India
        start_date: 2024-11
        end_date: Present
        highlights:
          - Leading cross-functional digital twin and test activities for electromagnetic product development, coordinating NVH assessment, magnetic/material evaluation, force measurement selection, test planning, supplier RFQ/RFI activities, risk assessment, and physical validation.
          - Developed a topology-optimization based motor design methodology to reduce rotor volume while maintaining torque and electromagnetic performance.
          - Defined component/system requirements and verification methods, created validation test cases with end-to-end traceability, coordinated CAE and physical testing, and used test–simulation correlation to support design decisions and future validation strategy.
          - Used MATLAB/Simulink and dSPACE-based virtual validation environments for e-drive/controller testing, calibration, and verification activities.
          - Awarded Creator Kudos Award (Q4 '25–'26).

      - company: Dyson
        position: Motor Drives Engineer (Electromagnetic Design and Control), RDD
        location: Singapore
        start_date: 2024-01
        end_date: 2024-10
        highlights:
          - Designed and optimized permanent-magnet systems for ultra-high-speed consumer-product motors (>150,000 RPM), considering magnetic performance, demagnetization margin, magnet retention, rotor structural limits, losses, and manufacturability.
          - Performed 2D/3D ANSYS electromagnetic FEA including nonlinear magnetic-material characteristics, magnet eddy-current losses, core losses, and high-frequency operating effects.
          - Automated Python–ANSYS electromagnetic analysis and flux-map generation, reducing manual simulation/post-processing effort for closed-loop Simulink environments.
          - Evaluated magnetic materials and worked with suppliers on magnet specifications, manufacturing constraints, design feasibility, and product-development requirements.

